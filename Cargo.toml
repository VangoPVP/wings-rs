[package]
name = "wings"
version = "0.1.0"
edition = "2024"
default-run = "wings"

[lib]
name = "wings"
path = "src/lib.rs"

[[bin]]
name = "wings"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws", "multipart"] }
axum-server = { version = "0.9.2", features = ["tls-rustls"] }
bollard = "0.21.1"
bytes = "1.12.1"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
chrono = { version = "0.4.45", features = ["serde"] }
flate2 = "1.1.11"
futures-util = "0.3.34"
globset = "0.4.21"
hex = "0.4.3"
ignore = "0.4.34"
jsonwebtoken = { version = "12.0.0", features = ["aws_lc_rs"] }
mime_guess = "2.0.5"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json", "query", "stream"] }
russh = "0.65.1"
russh-sftp = "3.0.1"
rustix = { version = "1.0.7", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.1.1"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.11.0"
sysinfo = { version = "0.40.3", default-features = false, features = ["system", "disk"] }
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml_edit = "0.25.19"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = { version = "0.7.20", features = ["io", "io-util"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "limit", "catch-panic"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }
utoipa = { version = "6", features = ["axum_extras", "uuid", "chrono", "preserve_order", "preserve_path_order"] }
utoipa-swagger-ui = { version = "10.0.2", features = ["axum", "vendored"] }
walkdir = "2.5.0"
xmltree = { version = "0.12.0", features = ["attribute-order"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full", "test-util"] }
